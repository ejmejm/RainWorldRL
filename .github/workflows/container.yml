# Build the Linux runtime image (Wine, Xvfb, Mesa, DXVK, VirtualGL, SteamCMD; no game files)
# and publish it to ghcr.io/<owner>/rainworld-rl, which `rainworld-rl setup` pulls with Apptainer.
name: container

on:
  push:
    branches: [main]
    paths: [container/**]
  workflow_dispatch:

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: container
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/rainworld-rl:latest
