[pytest]
# tests/            : harness (unit smoke tests + end-to-end tests that drive the real game)
# python/tests_unit : pure-Python unit tests for the client (added by the python/ rewrite)
# A listed path that does not exist yet is silently ignored by pytest.
testpaths = tests python/tests_unit
python_files = test_*.py
addopts = -ra -p no:cacheprovider
markers =
    e2e: end-to-end test that launches/drives the real Rain World game (skipped unless --e2e is given)
