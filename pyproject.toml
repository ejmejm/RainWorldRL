[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "rainworld-rl"
version = "1.0.0"
description = "Rain World as a Gymnasium reinforcement learning environment (BepInEx mod + Python client)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.21.0",
    "gymnasium>=0.29.0",
]

[project.scripts]
rainworld-rl = "rainworld_rl.cli:main"

[project.optional-dependencies]
render = ["Pillow>=9.0.0"]
test = ["pytest>=7.0"]

[tool.setuptools]
packages = ["rainworld_rl"]

[tool.setuptools.package-data]
rainworld_rl = ["mod/*"]
