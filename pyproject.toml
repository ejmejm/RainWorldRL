[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "rainworld-rl"
dynamic = ["version"]
description = "Rain World as a Gymnasium reinforcement learning environment (BepInEx mod + Python client)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.21.0",
    "gymnasium>=0.29.0",
]

[project.scripts]
rainworld-rl = "rainworld_rl.cli:main"

[project.optional-dependencies]
test = ["pytest>=7.0"]

[tool.setuptools]
packages = ["rainworld_rl"]

[tool.setuptools.dynamic]
version = {attr = "rainworld_rl.__version__"}

[tool.setuptools.package-data]
rainworld_rl = ["mod/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra -p no:cacheprovider"
markers = ["e2e: drives the real game (skipped unless --e2e)"]
